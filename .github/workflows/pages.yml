name: Deploy prospect demos to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Keep the public site refreshed even when local syncs are quiet.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build sanitized site
        run: python3 scripts/build_pages_site.py --sources sources --output _site --base-path /prospect-pipeline/
      - name: Verify sanitized site
        run: python3 scripts/verify_pages_site.py --site _site
      - name: Upload only _site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
